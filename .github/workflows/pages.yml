name: Deploy Docs to GitHub Pages

# 把 README 渲染成一个静态项目站点，发布到 GitHub Pages。
# 为什么不直接发 ui.html：前端所有数据都来自 book.mjs 的 /api/*，
# 脱离本地服务它只是一层空壳，发上去只会给人一个假页面。

on:
  push:
    branches: [main]
    paths: ['README.md', '.github/workflows/pages.yml', 'index.template.html']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render README → static index.html
        run: |
          mkdir -p _site
          python3 - <<'PY'
          import re, html, pathlib, datetime

          md = pathlib.Path('README.md').read_text(encoding='utf-8')
          tpl = pathlib.Path('index.template.html').read_text(encoding='utf-8')

          # --- 极简 Markdown → HTML，只覆盖本项目 README 用到的语法 ---
          def inline(s):
              s = html.escape(s)
              s = re.sub(r'`([^`]+)`', r'<code>\1</code>', s)
              s = re.sub(r'\*\*([^*]+)\*\*', r'<strong>\1</strong>', s)
              s = re.sub(r'(?<!\w)\*([^*\n]+)\*(?!\w)', r'<em>\1</em>', s)
              s = re.sub(r'\[([^\]]+)\]\(([^)]+)\)',
                         lambda m: '<a href="%s"%s>%s</a>' % (
                             m.group(2),
                             ' target="_blank" rel="noopener"' if m.group(2).startswith('http') else '',
                             m.group(1)), s)
              return s

          out, in_code, in_list, in_table = [], False, None, None

          def close_list():
              global in_list
              if in_list:
                  out.append('</%s>' % in_list)
                  in_list = None

          def close_table():
              global in_table
              if in_table:
                  out.append('</table>')
                  in_table = None

          for raw in md.split('\n'):
              line = raw.rstrip('\n')

              if line.startswith('```'):
                  close_list(); close_table()
                  if in_code:
                      out.append('</code></pre>')
                  else:
                      out.append('<pre><code class="lang-%s">' % (line[3:].strip() or 'text'))
                  in_code = not in_code
                  continue
              if in_code:
                  out.append(html.escape(line))
                  continue

              # 分隔线
              if re.fullmatch(r'-{3,}|\*{3,}', line.strip()):
                  close_list(); close_table()
                  out.append('<hr>')
                  continue

              # 表格（| a | b | + |---|---|）
              if line.strip().startswith('|'):
                  close_list()
                  cells = [c.strip() for c in line.strip().strip('|').split('|')]
                  if all(re.fullmatch(r':?-{2,}:?', c) for c in cells if c):
                      continue
                  if not in_table:
                      out.append('<table>')
                      in_table = True
                  out.append('<tr>' + ''.join('<td>%s</td>' % inline(c) for c in cells) + '</tr>')
                  continue

              # HTML 块（如 <div align="center">）：原样保留
              if re.match(r'^<(div|/div|span|br|img|center)', line.strip()):
                  close_list(); close_table()
                  out.append(line.strip())
                  continue

              # 标题
              m = re.match(r'^(#{1,6})\s+(.*)$', line)
              if m:
                  close_list(); close_table()
                  lvl = len(m.group(1))
                  out.append('<h%d>%s</h%d>' % (lvl, inline(m.group(2)), lvl))
                  continue

              # 引用块
              if line.startswith('>'):
                  close_list(); close_table()
                  out.append('<blockquote>%s</blockquote>' % inline(line.lstrip('> ').strip()))
                  continue

              # 无序 / 有序列表
              m = re.match(r'^\s*[-*]\s+(.*)$', line)
              if m:
                  close_table()
                  if in_list != 'ul':
                      close_list(); out.append('<ul>'); in_list = 'ul'
                  out.append('<li>%s</li>' % inline(m.group(1)))
                  continue
              m = re.match(r'^\s*\d+\.\s+(.*)$', line)
              if m:
                  close_table()
                  if in_list != 'ol':
                      close_list(); out.append('<ol>'); in_list = 'ol'
                  out.append('<li>%s</li>' % inline(m.group(1)))
                  continue

              close_list(); close_table()
              if not line.strip():
                  out.append('')
                  continue

              out.append('<p>%s</p>' % inline(line))

          if in_code:
              out.append('</code></pre>')
          close_table()
          close_list()

          body = '\n'.join(out)

          # 模板变量
          doc = tpl.replace('<!--CONTENT-->', body)
          doc = doc.replace('{{UPDATED}}',
                            datetime.datetime.now().strftime('%Y-%m-%d'))
          pathlib.Path('_site/index.html').write_text(doc, encoding='utf-8')
          print('rendered %d bytes' % len(doc))
          PY

      - name: Copy assets
        run: |
          for f in favicon.png apple-touch-icon.png; do
            [ -f "$f" ] && cp "$f" _site/ || true
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
