<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>王知之自习室 · 本地选座下单助手</title>
<meta name="description" content="在电脑上完成自习室选座、下单、月卡抵扣，并控制自己订单的门锁/签到/退座。Node 零依赖、零构建。">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --brand: #0052D9;
    --fg: #1a1d24;
    --fg-2: #555c6b;
    --fg-3: #8a91a0;
    --bg: #f6f7f9;
    --card: #ffffff;
    --line: #e6e8ec;
    --code-bg: #f0f2f5;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "SF Pro SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 24px 96px; }

  .hero {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px;
    margin-bottom: 32px;
    text-align: center;
  }
  .hero h1 { font-size: 28px; line-height: 1.35; margin: 0 0 12px; letter-spacing: -0.02em; }
  .hero .sub { color: var(--fg-2); font-size: 15px; margin: 0; }
  .badges { margin-top: 20px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .badge {
    font-size: 12.5px; padding: 4px 12px; border-radius: 999px;
    background: #eef2ff; color: var(--brand); border: 1px solid #dbe4ff;
    font-weight: 500;
  }
  .nav { margin-bottom: 32px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px 40px;
  }

  h1, h2, h3, h4, h5, h6 { line-height: 1.4; letter-spacing: -0.01em; margin: 2.2em 0 0.8em; }
  .card > :first-child, .hero > :first-child { margin-top: 0; }
  h2 {
    font-size: 21px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
    margin-top: 2.4em;
  }
  h3 { font-size: 17px; }
  h4 { font-size: 15.5px; color: var(--fg-2); }

  p { margin: 0.9em 0; }
  strong { font-weight: 600; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }

  code {
    font: 0.875em/1.6 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 0.9em;
  }
  pre {
    background: #1f2430; color: #dfe3ec;
    padding: 16px 18px; border-radius: 10px; overflow-x: auto;
    font-size: 13px; line-height: 1.7; margin: 1.2em 0;
  }
  pre code { background: none; padding: 0; color: inherit; font-size: inherit; }

  table {
    width: 100%; border-collapse: collapse; margin: 1.2em 0;
    font-size: 14.5px; display: block; overflow-x: auto;
  }
  th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
  th { background: #fafbfc; font-weight: 600; white-space: nowrap; }
  tr:nth-child(even) td { background: #fcfcfd; }

  ul, ol { padding-left: 1.5em; margin: 0.9em 0; }
  li { margin: 0.35em 0; }

  blockquote {
    margin: 1.2em 0; padding: 12px 18px;
    border-left: 3px solid var(--brand);
    background: #f3f6fd; border-radius: 0 8px 8px 0;
    color: var(--fg-2); font-size: 14.5px;
  }
  blockquote p { margin: 0.3em 0; }

  hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }

  footer {
    text-align: center; color: var(--fg-3); font-size: 13px; margin-top: 40px;
  }

  @media (max-width: 640px) {
    .wrap { padding: 24px 14px 64px; }
    .hero { padding: 28px 20px; }
    .card { padding: 24px 20px; border-radius: 12px; }
    .hero h1 { font-size: 22px; }
    h2 { font-size: 18.5px; }
    pre { border-radius: 8px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <!--CONTENT-->
  <footer>
    <p>更新于 {{UPDATED}} · <a href="https://github.com/poboll/wzz-seat-booking" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
</div>
</body>
</html>
